<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 415" width="380" height="415" role="img" aria-labelledby="t d">
  <title id="t">App Switcher Settings applet</title>
  <desc id="d">The panel applet popup in three sections: General has a Super+Tab shortcut toggle (on) and a Hide window title toggle (off); Theme has four equal swatches with Midnight selected; Switch scope has two equal options with All workspaces selected.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <g font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" fill="#e6e6ea">
    <rect x="10" y="10" width="360" height="395" rx="14" fill="#1c1b22" filter="url(#shadow)"/>
    <rect x="10.5" y="10.5" width="359" height="394" rx="14" fill="none" stroke="#fff" stroke-opacity="0.12"/>

    <text x="30" y="46" font-size="13" font-weight="600">General</text>
    <rect x="26" y="56" width="328" height="96" rx="10" fill="#26252d"/>
    <text x="42" y="86" font-size="14">Super+Tab shortcut</text>
    <rect x="298" y="68" width="44" height="24" rx="12" fill="#6194ff"/>
    <circle cx="330" cy="80" r="8" fill="#1c1b22"/>
    <rect x="42" y="104" width="296" height="1" fill="#fff" fill-opacity="0.1"/>
    <text x="42" y="134" font-size="14">Hide window title</text>
    <rect x="298" y="116" width="44" height="24" rx="12" fill="#3a3942"/>
    <circle cx="310" cy="128" r="8" fill="#9a9aa4"/>

    <text x="30" y="182" font-size="13" font-weight="600">Theme</text>
    <rect x="26" y="192" width="328" height="88" rx="10" fill="#26252d"/>
    <g stroke="#fff" stroke-opacity="0.06">
      <rect x="36.5" y="206.5" width="67" height="39" rx="6" fill="#212121"/>
      <rect x="116.5" y="206.5" width="67" height="39" rx="6" fill="#f2f2f2" stroke="none"/>
      <rect x="196.5" y="206.5" width="67" height="39" rx="6" fill="#262626"/>
    </g>
    <rect x="276" y="206" width="68" height="40" rx="6" fill="#0d1226" stroke="#6194ff" stroke-width="2.5"/>
    <g font-size="11" text-anchor="middle" fill="#cfcfd6">
      <text x="70" y="266">Dark</text>
      <text x="150" y="266">Light</text>
      <text x="230" y="266">Frosted</text>
      <text x="310" y="266">Midnight</text>
    </g>

    <text x="30" y="310" font-size="13" font-weight="600">Switch scope</text>
    <rect x="26" y="320" width="328" height="48" rx="10" fill="#26252d"/>
    <rect x="38" y="330" width="148" height="28" rx="6" fill="none" stroke="#6194ff" stroke-width="2"/>
    <rect x="194.5" y="330.5" width="147" height="27" rx="6" fill="none" stroke="#fff" stroke-opacity="0.15"/>
    <g font-size="12" text-anchor="middle">
      <text x="112" y="349">All workspaces</text>
      <text x="268" y="349">Current monitor</text>
    </g>

    <text x="190" y="390" font-size="10" text-anchor="middle" fill="#9a9aa4">v0.1.6</text>
  </g>
</svg>
