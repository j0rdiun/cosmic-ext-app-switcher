name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    name: Check version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The tag, the crate version and the metainfo <release> are three separate places
      # that have drifted before — the store shows the metainfo one, so a stale entry
      # ships a release users see as an older version.
      - name: Tag, Cargo.toml and metainfo must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
                  | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1)
          META=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
                  applet/data/io.github.cosmic-ext-applet-app-switcher.metainfo.xml | head -n1)

          echo "tag=$TAG  cargo=$CARGO  metainfo=$META"
          if [ "$TAG" != "$CARGO" ] || [ "$TAG" != "$META" ]; then
            echo "::error::version mismatch — tag '$TAG', Cargo.toml '$CARGO', metainfo '$META'"
            echo "Bump [workspace.package] version and add a matching <release> entry, then re-tag."
            exit 1
          fi

  build-x86_64:
    name: Build x86_64
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86_64-

      - name: Build
        run: cargo build --release --workspace

      - name: Rename binaries with arch suffix
        run: |
          mv target/release/cosmic-ext-app-switcher target/release/cosmic-ext-app-switcher-x86_64-unknown-linux-gnu
          mv target/release/cosmic-ext-applet-app-switcher target/release/cosmic-ext-applet-app-switcher-x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-x86_64
          path: |
            target/release/cosmic-ext-app-switcher-x86_64-unknown-linux-gnu
            target/release/cosmic-ext-applet-app-switcher-x86_64-unknown-linux-gnu

  build-aarch64:
    name: Build aarch64
    needs: check-version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-aarch64-

      - name: Build
        run: cargo build --release --workspace

      - name: Rename binaries with arch suffix
        run: |
          mv target/release/cosmic-ext-app-switcher target/release/cosmic-ext-app-switcher-aarch64-unknown-linux-gnu
          mv target/release/cosmic-ext-applet-app-switcher target/release/cosmic-ext-applet-app-switcher-aarch64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-aarch64
          path: |
            target/release/cosmic-ext-app-switcher-aarch64-unknown-linux-gnu
            target/release/cosmic-ext-applet-app-switcher-aarch64-unknown-linux-gnu

  release:
    name: Create Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          chmod +x artifacts/cosmic-ext-*
          cp applet/data/io.github.cosmic-ext-applet-app-switcher-symbolic.svg artifacts/
          ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            **One-line install (no Rust required):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            **Or build from source:**
            ```bash
            git clone https://github.com/${{ github.repository }}
            cd cosmic-ext-app-switcher
            make install
            ```

            **Uninstall:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/uninstall.sh | bash
            ```
